server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El frontend usa react-router (rutas del lado del cliente): cualquier
    # ruta que no sea un archivo real debe devolver index.html para que
    # react-router la resuelva, si no las URLs directas (ej. /pacientes/5)
    # o recargar la pagina daria un 404 de nginx.
    location / {
        try_files $uri /index.html;
    }
}
